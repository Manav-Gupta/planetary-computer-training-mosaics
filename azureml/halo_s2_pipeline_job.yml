$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: halo-s2-download-mosaic
description: Download Sentinel-2 scene samples from Planetary Computer and build mosaics.

code: ..

command: >-
  python scripts/run_azure_pipeline.py
  --config configs/planetary_config_azure_template.json
  --fields-path ${{inputs.fields}}
  --output-dir ${{outputs.samples}}
  --steps inventory download mosaic
  --mosaic-window-days 14
  --mosaic-method median

environment: azureml:sentinels_poly_timeseries_extract@latest

# CHANGE ME: a compute cluster that exists in your workspace.
# You can override at submit time instead of editing this file:
#   az ml job create -f azureml/halo_s2_pipeline_job.yml --set compute=azureml:<your-cluster>
compute: azureml:cpu-cluster

experiment_name: halo-sentinel2

inputs:
  fields:
    type: uri_folder
    # CHANGE ME: datastore folder holding the field polygons (shapefile + .shx/.dbf/.prj,
    # or a .gpkg/.geojson). The pipeline auto-picks the single vector file in this folder.
    path: azureml://datastores/workspaceblobstore/paths/halo/fields/

outputs:
  samples:
    type: uri_folder
    # CHANGE ME: datastore folder where scene samples and mosaics are written.
    path: azureml://datastores/workspaceblobstore/paths/halo/planetary_computer_samples/
