name: halo-s2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas
  - rasterio
  - shapely
  - pyproj
  - pandas
  - numpy
  - pyarrow
  - psutil
  - pip
  - pip:
      - planetary-computer
      - pystac-client
      - odc-stac
      # CPU-only torch wheels (small download); omnicloudmask auto-detects
      # cuda/mps and falls back to cpu, so a CUDA build of torch (large) is
      # only needed on machines actually doing GPU inference.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - omnicloudmask
